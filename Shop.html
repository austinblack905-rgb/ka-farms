<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop – K&A Farms</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://www.ka-farms.com/css/shopstyle.css" />
    <link rel="shortcut icon" type="image/x-icon" href="https://raw.githubusercontent.com/austinblack905-rgb/ka-farms/refs/heads/main/assets/KA_logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .original-price {
            color: #6b7280;
            margin-inline-end: 0.4rem;
        }
        .product-availability {
            margin: 0.35rem 0 0.65rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav">
            <div style="display:flex;align-items:center;gap:10px"><a href="https://www.ka-farms.com" style="text-decoration:none;color:inherit"><strong>K&A Farms</strong></a></div>
            <nav class="links">
                <a href="https://www.ka-farms.com/Shop" aria-current="page">Shop</a>
                <a href="https://www.ka-farms.com/cart" class="cartpill" title="View cart">
                    <span><i class="fa-solid fa-cart-shopping"></i></span>
                    <b id="cartCount">0</b>
                    <span>· $<span id="cartTotal">0.00</span></span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="h1">Shop</h1>
        <p class="notice" id="shopNotice" role="status" style="margin-bottom:16px;display:none;"></p>

        <div style="border:1px solid #eee;border-radius:8px;background:#fff;margin:10px" hidden>
            <hero style="text-align:center">
                <h3 style="color:red">Spring Sale!</h3>
                <p>Grab a dozen eggs for $2!</p>
                <p><small>Sale ends 4/1</small></p>
            </hero>
        </div>

        <section id="productGrid" class="grid" aria-label="Products"></section>
        <template id="productCard">
            <article class="card">
                <img alt="" loading="lazy" hidden>
                <div class="pad">
                    <div class="kicker" hidden></div>
                    <h2 style="margin:2px 0 6px;font-size:20px"><span data-title></span><br hidden><span class="badge" hidden></span></h2>
                    <p style="color:red" data-note hidden></p>
                    <p class="price"><s class="original-price" hidden></s><span data-price></span></p>
                    <p class="product-availability"></p>
                    <div class="controls">
                        <button type="button" class="step" aria-label="Decrease" disabled>–</button>
                        <span class="qty" aria-live="polite">0</span>
                        <button type="button" class="step" aria-label="Increase" disabled>+</button>
                        <button type="button" class="btn primary" data-add>Add to cart</button>
                    </div>
                </div>
            </article>
        </template>
    </main>

    <footer>
        <div class="container" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <span><span id="year"></span> K&A Farms</span>
            <span class="muted">Private link — please don’t share publicly</span>
        </div>
    </footer>

    <!-- Modal -->
    <div id="productModal" class="modal-backdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-body">
                <div class="modal-header">
                    <div>
                        <h2 id="modalTitle" class="modal-title"></h2>
                        <p id="modalSubtitle" class="modal-subtitle"></p>
                    </div>
                    <button type="button" class="modal-close" aria-label="Close">&times;</button>
                </div>

                <img id="modalImage" class="modal-img" src="" alt="" />

                <p id="modalDescription" class="modal-text"></p>
                <p id="modalAvailability" class="product-availability"></p>

                <div class="modal-footer">

                    <button class="step modal-step" aria-label="Decrease" disabled>–</button>
                    <span class="qty modal-qty" aria-live="polite">0</span>
                    <button class="step modal-step" aria-label="Increase" disabled>+</button>
                    <div class="modal-price">
                        <s id="modalOriginalPrice" class="original-price" hidden></s><span id="modalPrice">$0.00</span>
                    </div>
                    <button id="modalAddBtn" class="btn primary">
                        Add to cart
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!--Snow Filter-->
    <script src="https://www.ka-farms.com/js/Snow.js"></script>
    <!--Main Script-->
    <script>
        // ==== CART + SUPABASE CONFIG ====
        const STORAGE_KEY = 'ka_cart';
        const PRICES = Object.create(null); // filled from Supabase
        const DESCRIPTIONS = Object.create(null); // long text from Supabase

        const SUPABASE_URL = 'https://mxuqexwylasphrnldhmx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14dXFleHd5bGFzcGhybmxkaG14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzOTQ3NzMsImV4cCI6MjA4MDk3MDc3M30.u1mS0rM6EWH5BlJ6qvz4bXRCy5LQSqaF_9R0eUlPuLc';

        let supabaseClient = null;

        if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
        console.error('Supabase JS SDK is unavailable.');
        }

        // ==== CART HELPERS ====
        function loadCart() {
            try { return Object.assign(Object.create(null), JSON.parse(localStorage.getItem(STORAGE_KEY))); }
            catch { return Object.create(null); }
        }
        function saveCart(c) { localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); }
        function countItems(c) { return Object.values(c).reduce((a, b) => a + (b || 0), 0); }
        function totalCost(c) {
            return Object.entries(c).reduce(
                (sum, [k, q]) => sum + (PRICES[k] || 0) * (q || 0), 0
            );
        }
        function currency(n) { return (Math.round(n * 100) / 100).toFixed(2); }

        const cart = loadCart();

        function updateBadge() {
            document.getElementById('cartCount').textContent = countItems(cart);
            document.getElementById('cartTotal').textContent = currency(totalCost(cart));
        }

        // ==== WIRE UP CONTROLS (after prices loaded) ====
        function initControls() {
            document.querySelectorAll('.controls').forEach(row => {
                const key = row.dataset.key;
                const qtyEl = row.querySelector('.qty');
                const minusBtn = row.querySelectorAll('.step')[0];
                const plusBtn = row.querySelectorAll('.step')[1];
                const addBtn = row.querySelector('[data-add]');

                function disableSteps() { minusBtn.disabled = true; plusBtn.disabled = true; }
                function enableSteps() { minusBtn.disabled = false; plusBtn.disabled = false; }

                // Initialize state
                if (cart[key] > 0) {
                    qtyEl.textContent = cart[key];
                    enableSteps();
                } else {
                    qtyEl.textContent = 0;
                    disableSteps();
                }

                minusBtn.addEventListener('click', () => {
                    if (cart[key] > 0) {
                        cart[key]--;
                        if (cart[key] <= 0) {
                            delete cart[key];
                            qtyEl.textContent = 0;
                            disableSteps();
                        } else {
                            qtyEl.textContent = cart[key];
                        }
                        saveCart(cart);
                        updateBadge();
                    }
                });

                plusBtn.addEventListener('click', () => {
                    cart[key] = (cart[key] || 0) + 1;
                    qtyEl.textContent = cart[key];
                    saveCart(cart);
                    updateBadge();
                });

                addBtn.addEventListener('click', () => {
                    cart[key] = (cart[key] || 0) + 1;
                    qtyEl.textContent = cart[key];
                    enableSteps();
                    saveCart(cart);
                    updateBadge();
                });
            });
        }

        // ==== MODAL LOGIC ====
        function initModals() {
            const modal = document.getElementById('productModal');
            const closeBtn = modal.querySelector('.modal-close');
            const imgEl = document.getElementById('modalImage');
            const titleEl = document.getElementById('modalTitle');
            const subtitleEl = document.getElementById('modalSubtitle');
            const descEl = document.getElementById('modalDescription');
            const availabilityEl = document.getElementById('modalAvailability');
            const priceEl = document.getElementById('modalPrice');
            const originalPriceEl = document.getElementById('modalOriginalPrice');
            const addBtn = document.getElementById('modalAddBtn');

            // NEW: modal +/- and qty
            const modalMinusBtn = modal.querySelectorAll('.modal-step')[0];
            const modalPlusBtn = modal.querySelectorAll('.modal-step')[1];
            const modalQtyEl = modal.querySelector('.modal-qty');

            let currentKey = null;

            function syncCardControls(key) {
                const controls = document.querySelector(`.controls[data-key="${CSS.escape(key)}"]`);
                if (!controls) return;

                const qtyEl = controls.querySelector('.qty');
                const minusBtn = controls.querySelectorAll('.step')[0];
                const plusBtn = controls.querySelectorAll('.step')[1];

                const qty = cart[key] || 0;
                qtyEl.textContent = qty;
                minusBtn.disabled = qty <= 0;
                plusBtn.disabled = false;
            }

            function syncModalControls(key) {
                const qty = cart[key] || 0;
                modalQtyEl.textContent = qty;
                modalMinusBtn.disabled = qty <= 0;
                modalPlusBtn.disabled = false;
            }

            function openForCard(card) {
                const controls = card.querySelector('.controls');
                if (!controls) return;

                const key = controls.dataset.key;
                currentKey = key;

                const img = card.querySelector('img');
                const titleNode = card.querySelector('h2');
                const badgeNode = titleNode.querySelector('.badge');

                const titleText = titleNode.querySelector('[data-title]').textContent;
                imgEl.hidden = img.hidden;
                if (img.hidden) imgEl.removeAttribute('src');
                else imgEl.src = img.src;
                imgEl.alt = img.alt;
                titleEl.textContent = titleText;

                // Subtitle = badge text (if present)
                subtitleEl.textContent = badgeNode ? badgeNode.textContent.trim() : '';

                // Description: Pull from Supabase
                const descText = DESCRIPTIONS[key] || '';
                descEl.textContent = descText;
                availabilityEl.textContent = card.querySelector('.product-availability').textContent;

                const originalPrice = card.querySelector('.original-price');
                originalPriceEl.hidden = originalPrice.hidden;
                originalPriceEl.textContent = originalPrice.textContent;
                priceEl.textContent = card.querySelector('[data-price]').textContent;

                // Sync modal qty to current cart qty
                syncModalControls(key);

                modal.hidden = false;
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.hidden = true;
                document.body.style.overflow = '';
                currentKey = null;
            }

            // Close interactions
            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal(); // click on backdrop
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.hidden) closeModal();
            });

            // NEW: modal minus
            modalMinusBtn.addEventListener('click', () => {
                if (!currentKey) return;
                if (!cart[currentKey]) return;

                cart[currentKey]--;
                if (cart[currentKey] <= 0) {
                    delete cart[currentKey];
                }

                saveCart(cart);
                updateBadge();
                syncModalControls(currentKey);
                syncCardControls(currentKey);
            });

            // NEW: modal plus
            modalPlusBtn.addEventListener('click', () => {
                if (!currentKey) return;

                cart[currentKey] = (cart[currentKey] || 0) + 1;

                saveCart(cart);
                updateBadge();
                syncModalControls(currentKey);
                syncCardControls(currentKey);
            });

            // Add to cart from modal (still adds +1)
            addBtn.addEventListener('click', () => {
                if (!currentKey) return;

                cart[currentKey] = (cart[currentKey] || 0) + 1;

                saveCart(cart);
                updateBadge();
                syncModalControls(currentKey);
                syncCardControls(currentKey);
            });

            // Wire up click on each product card image + title
            document.querySelectorAll('.card').forEach(card => {
                const img = card.querySelector('img');
                const title = card.querySelector('h2');

                if (img) {
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', () => openForCard(card));
                }
                if (title) {
                    title.style.cursor = 'pointer';
                    title.addEventListener('click', () => openForCard(card));
                }
            });
        }


        // Keep the display details that currently live outside the products table.
        const cardDetails = new Map([
            ["eggs", {"kicker": "Farm-Fresh", "badge": "1 Dozen", "note": ""}],
            ["scrubber", {"kicker": "Kitchen Tool", "badge": "", "note": ""}],
            ["vanilla", {"kicker": "Small-Batch", "badge": "2 oz", "note": ""}],
            ["crinkle", {"kicker": "Fresh Baked", "badge": "24 ct", "note": "48 hour lead"}],
            ["butterCake", {"kicker": "Fresh Baked", "badge": "9x13 pan", "note": ""}],
            ["chocChip", {"kicker": "Fresh Baked", "badge": "18 ct", "note": ""}],
            ["cupCookie", {"kicker": "Fresh Baked", "badge": "24 ct", "note": ""}],
            ["strCookie", {"kicker": "Fresh Baked", "badge": "12 ct", "note": ""}]
        ]);
        const productOrder = [...cardDetails.keys()];

        function describeAvailability({ availability, inventory_count: count }) {
            const hasCount = Number.isInteger(count) && count >= 0;

            if (availability === 'by_order') {
                return hasCount && count > 0 ? `Made to order · ${count} available now` : 'Made to order';
            }

            if (availability === 'out_of_stock' || count === 0) return 'Out of stock';
            if (hasCount) return `In stock · ${count} available`;
            if (availability === 'in_stock') return 'In stock';
            return 'Availability unlisted';
        }

        function effectivePriceCents(product) {
            const regular = product.price_cents;
            const sale = product.sale_price_cents;
            return Number.isInteger(sale) && sale >= 0 && sale < regular ? sale : regular;
        }

        function createProductCard(product) {
            const card = document.getElementById('productCard').content.firstElementChild.cloneNode(true);
            const details = cardDetails.get(product.id) || {};
            const img = card.querySelector('img');
            if (product.thumb) {
                const url = URL.parse(product.thumb, document.baseURI);
                if (url && (url.protocol === 'https:' || url.protocol === 'http:')) {
                    img.src = url.href;
                    img.hidden = false;
                }
            }
            img.alt = product.title;
            card.querySelector('[data-title]').textContent = product.title;
            const priceCents = effectivePriceCents(product);
            const originalPrice = card.querySelector('.original-price');
            originalPrice.hidden = priceCents === product.price_cents;
            originalPrice.textContent = '$' + currency(product.price_cents / 100);
            card.querySelector('[data-price]').textContent = '$' + currency(priceCents / 100);
            card.querySelector('.product-availability').textContent = describeAvailability(product);
            card.querySelector('.controls').dataset.key = product.id;

            for (const [selector, value] of [
                ['.kicker', details.kicker],
                ['.badge', details.badge],
                ['[data-note]', details.note],
            ]) {
                const element = card.querySelector(selector);
                element.textContent = value || '';
                element.hidden = !value;
            }
            card.querySelector('h2 br').hidden = !details.badge;
            return card;
        }

        async function loadProducts() {
            const notice = document.getElementById('shopNotice');
            notice.style.display = 'block';
            notice.textContent = 'Loading products…';

            try {
                if (!supabaseClient) throw new Error('Supabase JS SDK is unavailable.');
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('id, title, thumb, price_cents, sale_price_cents, description, availability, inventory_count')
                    .eq('is_active', true)
                    .order('inserted_at')
                    .order('id');

                if (error) throw error;

                const order = id => cardDetails.has(id) ? productOrder.indexOf(id) : productOrder.length;
                data.sort((first, second) => order(first.id) - order(second.id));
                const cards = data.map(product => createProductCard(product));
                for (const product of data) {
                    PRICES[product.id] = effectivePriceCents(product) / 100;
                    DESCRIPTIONS[product.id] = product.description || '';
                }

                document.getElementById('productGrid').replaceChildren(...cards);
                updateBadge();
                initControls();
                initModals();

                if (cards.length) notice.style.display = 'none';
                else notice.textContent = 'No products are available right now.';
            } catch (error) {
                console.error('Unable to load the shop catalog:', error);
                notice.textContent = 'Unable to load products. Please refresh the page to try again.';
                document.getElementById('cartCount').textContent = countItems(cart);
                document.getElementById('cartTotal').textContent = '—';
            }
        }

        loadProducts();
    </script>
</body>
</html>
